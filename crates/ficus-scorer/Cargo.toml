[package]
name = "ficus-scorer"
description = "Runs a root's checks against a attempt, inside a Cloudflare Container"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ficus-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util"] }
