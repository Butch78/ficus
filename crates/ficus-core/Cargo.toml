[package]
name = "ficus-core"
description = "Platform-independent Ficus domain logic (host-testable, no Workers APIs)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
serde_json = "1.0.151"
