# Every push and pull request: the infra TypeScript (everything Ficus runs),
# and these workflows themselves.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # secretspec asks agents why they read secrets; CI reads none of them.
  SECRETSPEC_REASON: "CI: build and test, no secrets"

jobs:
  infra:
    name: Infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/devenv
      - run: devenv shell -- bun install --frozen-lockfile
      - run: devenv shell -- bun run typecheck
      - run: devenv shell -- bun run lint
      - run: devenv shell -- bun run test

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/devenv
      - run: devenv shell -- actionlint
      - run: devenv shell -- zizmor --min-severity medium .github
