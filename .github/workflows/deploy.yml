# Deploys, alchemy's way: one stage per pull request (`pr-<n>`, destroyed
# when it closes) and `prod` from main. Everything the jobs need comes from
# infra/bootstrap.run.ts, which also sets FICUS_DEPLOYS_ENABLED: until it has
# run, every job here skips.
name: Deploy

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]

permissions:
  contents: read

env:
  SECRETSPEC_REASON: "CI: deploy with the bootstrap-minted token"
  RUSTC_WRAPPER: ""

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}
    # Pull requests from forks never get the deploy token.
    if: >-
      vars.FICUS_DEPLOYS_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write # the preview comment
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}
      cancel-in-progress: false
    env:
      STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/devenv
      - name: Deploy
        id: deploy
        working-directory: infra
        run: |
          set -euo pipefail
          devenv shell -- bun install --frozen-lockfile
          devenv shell -- bun run deploy | tee "$RUNNER_TEMP/deploy.log"
          api=$(grep -oE "api: '[^']+'" "$RUNNER_TEMP/deploy.log" | tail -1 | cut -d"'" -f2)
          echo "api=$api" >> "$GITHUB_OUTPUT"
      - name: Smoke (the full tree cycle through the Api)
        env:
          FICUS_API: ${{ steps.deploy.outputs.api }}
        run: devenv shell -- just e2e

  destroy:
    name: Destroy pr-${{ github.event.number }}
    if: >-
      vars.FICUS_DEPLOYS_ENABLED == 'true' &&
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-pr-${{ github.event.number }}
      cancel-in-progress: false
    env:
      STAGE: pr-${{ github.event.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/devenv
      - name: Destroy
        working-directory: infra
        run: |
          set -euo pipefail
          case "$STAGE" in pr-[0-9]*) ;; *) echo "refusing to destroy $STAGE" >&2; exit 1 ;; esac
          devenv shell -- bun install --frozen-lockfile
          devenv shell -- bun run destroy:ci
