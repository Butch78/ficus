[project]
name = "ficus"
revision = "1.0"

# Ficus's own Cloudflare credentials, kept apart from any other project's
# deploy token. Optional so the shell still opens without them; the tools
# that need them (alchemy, `just clef-review`) fail by name when they are absent.
[profiles.default]
CLOUDFLARE_ACCOUNT_ID = { required = false, description = "Not secret, but supplied the same way" }
CLOUDFLARE_API_TOKEN = { required = false, description = "Workers deploy + Workers AI read (Clef) + Artifacts" }
